services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: thermovolt
      POSTGRES_USER: thermovolt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - vehicle_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermovolt -d thermovolt"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:5050:5050"
    environment:
      DATABASE_URL: postgresql://thermovolt:${DB_PASSWORD}@postgres:5432/thermovolt
      HOST: 0.0.0.0
      PORT: 5050
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  vehicle_database:
